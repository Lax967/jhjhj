<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="intro-screen">
        <button id="start-btn">Click to Open Our Memories</button>
    </div>

    <div class="container">
        <div class="left-side">
            <div class="envelope" data-month="1">Month 1</div>
            <div class="envelope" data-month="2">Month 2</div>
            <div class="envelope" data-month="3">Month 3</div>
        </div>

        <div class="center-bouquet">
            <img src="bouquet.png" alt="Bouquet" class="bouquet-img">
        </div>

        <div class="right-side">
            <div class="envelope" data-month="4">Month 4</div>
            <div class="envelope" data-month="5">Month 5</div>
            <div class="envelope" data-month="6">Month 6</div>
        </div>
    </div>

    <div id="modal" class="hidden">
        <div class="modal-content">
            <p id="letter-text">This is our memory!</p>
            <button onclick="closeModal()">Close</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
